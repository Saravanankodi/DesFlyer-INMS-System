// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Pinned to 8.8.2: the installed Android Studio (Ladybug, build 242)
        // supports up to AGP 8.8.2 and refuses to sync a newer plugin.
        classpath 'com.android.tools.build:gradle:8.8.2'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Kotlin 1.8 merged kotlin-stdlib-jdk7/jdk8 into kotlin-stdlib. A stale
    // kotlin-stdlib-jdk7:1.6.21 / kotlin-stdlib-jdk8:1.6.21 (pulled in by
    // kotlinx-coroutines 1.6.4 from Cordova) next to kotlin-stdlib:1.8.22 puts
    // the same classes on the classpath twice and fails
    // :checkDebugAndroidTestDuplicateClasses. Pin every stdlib artifact to one
    // version so there is exactly one copy of those classes.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.8.22'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
