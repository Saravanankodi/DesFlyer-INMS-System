<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>DesFlyer INMS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
    }
    .shell { max-width: 420px; width: 100%; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 700; letter-spacing: -1px; color: #fff;
      box-shadow: 0 10px 30px rgba(37, 99, 235, .35);
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.2px; }
    p { margin: 0; font-size: 14px; line-height: 1.6; color: #94a3b8; }
    .card {
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid #1e293b;
      border-radius: 14px;
      background: #111c33;
      text-align: left;
    }
    .card strong { display: block; color: #e2e8f0; font-size: 13px; margin-bottom: 6px; }
    code {
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0b1220;
      color: #7dd3fc;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-all;
    }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #f59e0b; margin-right: 6px; vertical-align: 1px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="logo">IN</div>
    <h1>DesFlyer INMS</h1>
    <p>Internship Management System</p>

    <div class="card">
      <strong><span class="dot"></span>Server URL not configured yet</strong>
      <p>This is the offline shell. Set the live website address once and the app will load it automatically.</p>
      <code>capacitor.config.ts → server.url = "https://your-domain"</code>
      <p style="margin-top:10px">Then run <code style="display:inline;padding:2px 6px">npx cap sync android</code></p>
    </div>
  </main>
</body>
</html>
