<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Internship Tracker{% endblock %} · Internship Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-nav"><div class="container-fluid px-4 px-lg-5">
  <a class="navbar-brand" href="{{ url_for('dashboard') }}"><span class="brand-mark"><i class="bi bi-kanban-fill"></i></span> Intern<span>ship</span></a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto gap-lg-2">
    <a class="nav-link" href="{{ url_for('dashboard') }}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
    <a class="nav-link" href="{{ url_for('view_interns') }}"><i class="bi bi-people-fill"></i> Interns</a>
    <a class="nav-link" href="{{ url_for('view_tasks') }}"><i class="bi bi-list-check"></i> Tasks</a>
    <a class="nav-link" href="{{ url_for('reports') }}"><i class="bi bi-bar-chart-fill"></i> Reports</a>
  </div><a class="btn btn-accent ms-lg-3" href="{{ url_for('assign_task') }}"><i class="bi bi-plus-lg"></i> Assign task</a></div>
</div></nav>
<main class="container-fluid px-4 px-lg-5 py-4 py-lg-5">
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="container-fluid px-4 px-lg-5 pb-4 text-muted small">Internship Tracker · {{ current_year }}</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
